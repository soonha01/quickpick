<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>경매 상세</title>
  <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="/css/sb-admin-2.min.css" rel="stylesheet">

  <script src="/vendor/jquery/jquery.min.js"></script>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="/js/sb-admin-2.min.js"></script>
</head>
<body id="page-top">
  <div id="wrapper">
    <div id="sidebar-container"></div>

    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <div id="topbar-container"></div>

        <div class="container-fluid">
          <!-- 제목 -->
          <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">경매 상세보기</h1>
          </div>

          <!-- 상세 내용 표시 영역 -->
            <div class="container mt-5">
                <div class="card shadow p-4">
                    <h3 id="title" class="mb-3 text-primary">제목</h3>
                    <img id="itemImage" src="" alt="경매 이미지" class="img-fluid mb-3" style="max-height: 300px;">
                    <p><strong>설명:</strong> <span id="description" class="text-muted"></span></p>
                    <p><strong>현재가:</strong> <span id="current_price" class="text-muted"></span></p>
                    <p><strong>호가 단위:</strong> <span id="bid_unit" class="text-muted"></span></p>
                    <p><span id="remaining_time">계산 중...</span></p>
                    <p><strong>상태:</strong> <span id="status" class="badge"></span></p>

                    <div class="mt-4">
                        <button id="bidButton" class="btn btn-lg btn-warning">입찰하기</button>
                        <p id="bidResult" class="mt-2 text-success" style="display: none;">입찰 완료!</p>
<!-- 거래 완료 버튼 (작성자만 보임) -->
  <button id="completeButton" class="btn btn-lg btn-danger mt-2" style="display: none;">거래 완료</button>
</div>

                    
                </div>
            </div>

            <!-- 오른쪽 하단 고정 버튼 -->
            <a href="/items/itemList" class="btn btn-primary rounded-circle shadow"
            style="position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 18px;">
            ←
            </a>

        </div>
      </div>
      <div id="footer-container"></div>
    </div>
  </div>

  <a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
  </a>
</body>
<script src="/js/includeAndSession.js"></script>
<script src="/js/itemDetail.js"></script>
<script>
  let writerKey = null;//채팅 관련해서 내용 추가
  let loginUserKey = null;
  let auctionId = new URLSearchParams(location.search).get('id');

  fetch(`/items/itemDetail/data?id=${auctionId}`)
    .then(res => res.json())
    .then(data => {
      writerKey = data.writerKey;
      loginUserKey = data.loginUserKey;

      // 작성자와 로그인 유저가 같으면 거래완료 버튼 보이게
      if (writerKey && loginUserKey && writerKey === loginUserKey) {
        document.getElementById('completeButton').style.display = 'inline-block';
      }
    });

  // 거래 완료 버튼 클릭 시
  document.getElementById('completeButton').addEventListener('click', () => {
    if (!confirm('정말 거래를 완료하시겠습니까?')) return;

    fetch('/items/itemDetail/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: auctionId })
    })
      .then(res => {
        if (!res.ok) throw new Error('요청 실패');
        alert('거래가 완료되었습니다.');
        location.reload();
      })
      .catch(err => {
        console.error(err);
        alert('오류가 발생했습니다.');
      });
  });//채팅 관련해서 내용 추가
</script>
</html>
