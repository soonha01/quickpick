<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>회원가입</title>
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="css/sb-admin-2.min.css" rel="stylesheet">
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="js/sb-admin-2.min.js"></script>
</head>

<body class="bg-gradient-primary">
  <div class="container">
    <div class="card o-hidden border-0 shadow-lg my-5">
      <div class="card-body p-0">
        <div class="row">
          <div class="col-lg-5 d-none d-lg-block bg-register-image"></div>
          <div class="col-lg-7">
            <div class="p-5">
              <div class="text-center">
                <h1 class="h4 text-gray-900 mb-4">회원가입</h1>
              </div>

              <!-- ✅ form에 action 제거하고 id 추가 -->
              <form class="user" id="registerForm">

                <!-- 아이디 + 중복 확인 -->
                <div class="form-group">
                  <label for="login_id">아이디</label>
                  <div class="input-group">
                    <input type="text" name="login_id" id="login_id" class="form-control form-control-user" placeholder="아이디" required>
                    <div class="input-group-append">
                      <button class="btn btn-outline-primary" type="button" onclick="checkDuplicate('login_id')">중복 확인</button>
                    </div>
                  </div>
                </div>

                <!-- 닉네임 + 중복 확인 -->
                <div class="form-group">
                  <label for="nickname">닉네임</label>
                  <div class="input-group">
                    <input type="text" name="display_name" id="display_name" class="form-control form-control-user" placeholder="닉네임" required>
                    <div class="input-group-append">
                      <button class="btn btn-outline-primary" type="button" onclick="checkDuplicate('display_name')">중복 확인</button>
                    </div>
                  </div>
                </div>

                <!-- 휴대폰 -->
              <div class="form-group">
                <label for="phone_number">휴대폰 번호</label>
            <input type="text" id="phone_number" name="phone_number" class="form-control form-control-user" maxlength="13" placeholder="010-1234-5678" required>
              </div>

                <!-- 비밀번호 -->
                <div class="form-group row">
                  <div class="col-sm-6 mb-3 mb-sm-0">
                    <input type="password" name="password" class="form-control form-control-user" placeholder="비밀번호" required>
                  </div>
                  <div class="col-sm-6">
                    <input type="password" name="password_confirm" class="form-control form-control-user" placeholder="비밀번호 확인" required>
                  </div>
                </div>
                <!-- 약관 동의 -->
                <div class="form-group form-check">
                  <input type="checkbox" class="form-check-input" id="termsCheck" required>
                  <label class="form-check-label" for="termsCheck">
                    <a href="/terms.html" target="_blank">(필수) 낙찰 시 거래 의무에 동의합니다.</a>
                  </label>
                </div>

                <!-- 회원가입 버튼 -->
                <button type="submit" class="btn btn-primary btn-user btn-block">
                  회원가입 완료
                </button>

                <hr>
                <a href="login.html" class="btn btn-secondary btn-user btn-block">
                  로그인으로 돌아가기
                </a>
              </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="/js/includeAndSession.js"></script>
<script src="js/register.js"></script>
</html>
