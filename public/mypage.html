<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>마이페이지</title>
    <!-- CSS -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <style>
    .profile-img {
         width: 150px;
         height: 150px;
         object-fit: cover;
         border-radius: 50%;
         border: 2px solid #ddd;
         }
         </style>

    <!-- JS -->
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="/js/sb-admin-2.min.js"></script>
    
</head>
<body id="page-top">
    <!-- Page Wrapper -->
    <div id="wrapper">
        <!-- 사이드 bar -->
        <div id="sidebar-container"></div>
        <!-- End of Sidebar -->
        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">
            <!-- Main Content -->
            <div id="content">

                <!-- 탑 bar -->
                <div id="topbar-container"></div>
                <div class="container-fluid">
                    <!-- 여기부터 개발 -->
                     <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">마이페이지</h1>
                    </div>
                    <!-- 마이페이지 프로필 폼 -->
                     <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">회원 정보</h6>
                        </div>
                        <div class="card-body">
                            <form id="profileForm">
                                <!-- 보기 모드 -->
                                 <div id="profileView">
                                    <p><strong>프로필 사진:</strong><br>
                                        <img id="viewProfileImage" src="/uploads/user_1.jpg" alt="프로필 이미지" class="profile-img">
                                    </p>
                                    <p><strong>닉네임:</strong> <span id="viewDisplayName"></span></p>
                                    <p><strong>아이디:</strong> <span id="viewUserId"></span></p>
                                    <p><strong>전화번호:</strong> <span id="viewPhoneNumber"></span></p>
                                    <button type="button" class="btn btn-primary" id="editButton">수정하기</button>
                                </div>
                                <!-- 수정 모드 -->
                                 <div id="profileEdit" style="display: none;">
                                    <div class="form-group">
                                        <label for="profileImage">프로필 이미지</label>
                                        <input type="file" id="profileImage" accept="image/*" class="form-control-file">
                                    </div>
                                    <div class="form-group">
                                        <label for="display_name">닉네임</label>
                                        <input type="text" class="form-control" id="display_name" name="display_name" required />
                                        <div class="input-group-append">
                                            <button type="button" class="btn btn-secondary" id="check-duplicate-btn">중복 확인</button>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="phone_number">전화번호</label>
                                        <input type="text" class="form-control" id="phone_number" name="phone_number" required />
                                    </div>
                                    <button type="submit" class="btn btn-success">저장</button>
                                    <button type="button" class="btn btn-secondary" id="cancelEdit">취소</button>
                                </div>
                            </form>
                        </div>

                            </form>
                        </div>
                    </div>
                    <!-- 화면 왼쪽 상단 페이지명 -->

                </div>   
            </div>
            <!--<div id="footer-container"></div>-->
        </div>
        <!-- End of Content Wrapper -->

    </div>
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>  
    <script src="/js/mypage.js"></script>
    <script src="/js/includeAndSession.js"></script>
</body>

</html>
