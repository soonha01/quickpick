<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>아이템 글작성</title>
    <!-- CSS -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <!-- JS -->
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="/js/sb-admin-2.min.js"></script>
</head>
<body id="page-top">
    <!-- Page Wrapper -->
    <div id="wrapper">
        <!-- 사이드 bar -->
        <div id="sidebar-container"></div>
        <!-- End of Sidebar -->
        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">
            <!-- Main Content -->
            <div id="content">
                <!-- 탑 bar -->
                <div id="topbar-container"></div>
                <div class="container-fluid">
                    <!-- 화면 왼쪽 상단 페이지명 -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">아이템 글 작성</h1>
                    </div>

                    <!-- 글쓰기 폼 -->
                    <form id="itemWriteForm">
                        <div class="form-group">
                            <label for="image">이미지 업로드</label>
                            <input type="file" class="form-control-file" id="image">
                        </div>

                        <div class="form-group">
                            <label for="title">제목</label>
                            <input type="text" class="form-control" id="title" placeholder="제목을 입력하세요">
                        </div>

                        <div class="form-group">
                            <label for="description">설명</label>
                            <textarea class="form-control" id="description" rows="5" placeholder="설명을 입력하세요"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="duration">마감 시간 선택</label>
                            <select class="form-control" id="duration">
                                <option value="0.0083">30초 (테스트)</option><!--테스트용-->
                                <option value="3">3시간</option>
                                <option value="6">6시간</option>
                                <option value="9">9시간</option>
                                <option value="12">12시간</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="minPrice">최소 금액</label>
                            <input type="text" class="form-control" id="minPrice" placeholder="예: 10,000 원">
                        </div>

                        <div class="form-group">
                            <label for="bidStep">호가 단위</label>
                            <input type="text" class="form-control" id="bidStep" placeholder="예: 500 원">
                        </div>

                        <button type="submit" class="btn btn-primary">등록</button>
                    </form>
                </div>   
            </div>
            <div id="footer-container"></div>
        </div>
        <!-- End of Content Wrapper -->
    </div>
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>    
</body>

<script src="/js/includeAndSession.js"></script>
<script>
  function formatNumber(input) {
    const onlyNum = input.replace(/[^\d]/g, '');
    return onlyNum.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function unformatNumber(formatted) {
    return formatted.replace(/,/g, '');
  }

  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('itemWriteForm');
    const minPriceInput = document.getElementById('minPrice');
    const bidStepInput = document.getElementById('bidStep');

    // 입력 시 자동 콤마 포맷 적용
    [minPriceInput, bidStepInput].forEach(input => {
      input.addEventListener('input', function () {
        const caret = this.selectionStart;
        const rawValue = this.value.replace(/[^\d]/g, '');
        this.value = formatNumber(rawValue);
        this.setSelectionRange(caret, caret);
      });
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const imageFile = document.getElementById('image').files[0];
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const duration = document.getElementById('duration').value;
      const minPrice = unformatNumber(minPriceInput.value);
      const bidStep = unformatNumber(bidStepInput.value);
      
      //호가단위가 최소금액보다 크면 막기
      if (bidStep > minPrice) {
        alert('호가 단위는 시작 금액을 초과할 수 없습니다.');
        return;
      }

      if (!title || !description || !duration || !minPrice || !bidStep) {
        alert('모든 입력값을 올바르게 입력해주세요.');
        return;
      }

      const formData = new FormData();
      formData.append('image', imageFile);
      formData.append('title', title);
      formData.append('description', description);
      formData.append('duration', duration);
      formData.append('minPrice', minPrice);
      formData.append('bidStep', bidStep);

      try {
        const res = await fetch('/items/itemWrite', {
          method: 'POST',
          body: formData,
          credentials: 'include' // 세션 유지
        });

        if (res.ok) {
          alert('경매글 등록 성공!');
          window.location.href = '/items/itemList';
        } else {
          alert('등록 실패 😢');
        }
      } catch (err) {
        console.error('에러 발생:', err);
        alert('서버 에러가 발생했습니다.');
      }
    });
  });
</script>
</html>
